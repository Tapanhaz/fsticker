[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "Cython>=3.3.0",
    "cmake>=3.20",
    "cykit>=0.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "fsticker"
version = "0.1.0"
description = "Multi feed merged websocket ticker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Tapan Hazarika", email = "tapanhaz@gmail.com" }
]

requires-python = ">=3.9"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*t-* pp* *-win32 *-manylinux_i686 *-musllinux_*"
build-frontend = "build"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build-verbosity = 1
test-command = "python -c \"import fsticker\""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "15.4" }